<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="445" viewBox="0 0 1200 445" role="img" aria-labelledby="title desc">
<title id="title">Mizanora — purpose-led, possibility-built</title><desc id="desc">Mizanora. Balance in purpose. Light in progress. Decorative motion respects reduced-motion settings.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061b19"/><stop offset="1" stop-color="#103c32"/></linearGradient><linearGradient id="line"><stop stop-color="#46dfaa"/><stop offset="1" stop-color="#e6c77d"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#84d3b6" stroke-opacity=".055"/></pattern></defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif}.orbit{transform-origin:1000px 205px;animation:rotate 40s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 14;animation:flow 8s linear infinite}.rise{animation:rise 6s ease-in-out infinite}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-220}}@keyframes rise{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="445" rx="24" fill="url(#bg)"/><rect width="1200" height="445" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="443" rx="23" fill="none" stroke="#81c7ac" stroke-opacity=".2"/>
<text x="60" y="60" font-size="14" fill="#e6c77d" >M I Z A N O R A   /   P A K I S T A N</text><text x="60" y="153" font-size="68" fill="#f1fbf7" font-weight="700">Purpose-led.</text><text x="60" y="228" font-size="68" fill="#f1fbf7" font-weight="700">Possibility-built.</text><text x="63" y="285" font-size="22" fill="#a9c7bf" >Digital infrastructure. Ethical commerce. Thoughtful AI.</text><text x="63" y="330" font-size="20" fill="#e6c77d" >Rooted in Mizan. Inspired by Noor.</text><path d="M64 369H750" stroke="url(#line)" class="flow"/><text x="63" y="405" font-size="13" fill="#89b7a8" letter-spacing="2">BALANCE IN PURPOSE  /  LIGHT IN PROGRESS</text><circle cx="1000" cy="205" r="134" fill="#0a2a24" stroke="#366b54"/><g class="orbit" fill="none" stroke="#e6c77d"><circle cx="1000" cy="205" r="116" stroke-dasharray="2 18"/><path d="M1000 67V89M1000 321V343M862 205H884M1116 205H1138"/></g><g class="rise"><path d="M1034 130a84 84 0 1 0 30 129 71 71 0 1 1-30-129" fill="#e6c77d"/><path d="m1039 168 8 20 21 2-16 14 5 21-18-11-18 11 5-21-16-14 21-2Z" fill="#62dfaf"/></g><circle class="pulse" cx="1110" cy="106" r="5" fill="#62dfaf"/></svg>
