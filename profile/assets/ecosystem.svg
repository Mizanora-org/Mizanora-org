<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-labelledby="title desc">
<title id="title">Mizanora ecosystem: commerce, Noor AI and community</title><desc id="desc">Mizanora. Balance in purpose. Light in progress. Decorative motion respects reduced-motion settings.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061b19"/><stop offset="1" stop-color="#103c32"/></linearGradient><linearGradient id="line"><stop stop-color="#46dfaa"/><stop offset="1" stop-color="#e6c77d"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#84d3b6" stroke-opacity=".055"/></pattern></defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif}.orbit{transform-origin:1000px 205px;animation:rotate 40s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 14;animation:flow 8s linear infinite}.rise{animation:rise 6s ease-in-out infinite}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-220}}@keyframes rise{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="326" rx="24" fill="url(#bg)"/><rect width="1200" height="326" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="324" rx="23" fill="none" stroke="#81c7ac" stroke-opacity=".2"/>
<text x="48" y="49" font-size="15" fill="#e6c77d" letter-spacing="3">THE MIZANORA ECOSYSTEM</text><text x="48" y="87" font-size="30" fill="#f1fbf7" font-weight="600">One platform. Connected possibilities.</text><rect x="48" y="120" width="356" height="176" rx="16" fill="#0b2a24" stroke="#32604e"/><text x="70" y="153" font-size="14" fill="#e6c77d" >01</text><text x="70" y="192" font-size="28" fill="#f1fbf7" font-weight="600">Commerce</text><text x="70" y="231" font-size="17" fill="#a9c7bf" >Shop Smart. Shop Halal.</text><text x="70" y="266" font-size="14" fill="#a9c7bf" >Products / COD / customer support</text><path class="flow" d="M70 283H380" stroke="#62dfaf" opacity=".5"/><rect x="422" y="120" width="356" height="176" rx="16" fill="#0b2a24" stroke="#32604e"/><text x="444" y="153" font-size="14" fill="#e6c77d" >02</text><text x="444" y="192" font-size="28" fill="#f1fbf7" font-weight="600">Noor AI</text><text x="444" y="231" font-size="17" fill="#a9c7bf" >Assistance that feels closer.</text><text x="444" y="266" font-size="14" fill="#a9c7bf" >Shopping help / Urdu &amp; English voice</text><path class="flow" d="M444 283H754" stroke="#62dfaf" opacity=".5"/><rect x="796" y="120" width="356" height="176" rx="16" fill="#0b2a24" stroke="#32604e"/><text x="818" y="153" font-size="14" fill="#e6c77d" >03</text><text x="818" y="192" font-size="28" fill="#f1fbf7" font-weight="600">Community</text><text x="818" y="231" font-size="17" fill="#a9c7bf" >Useful beyond the checkout.</text><text x="818" y="266" font-size="14" fill="#a9c7bf" >Live channel / tools / worker program</text><path class="flow" d="M818 283H1128" stroke="#62dfaf" opacity=".5"/></svg>
