<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
<title id="title">Mizanora principles: balance, illumination and impact</title><desc id="desc">Mizanora. Balance in purpose. Light in progress. Decorative motion respects reduced-motion settings.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061b19"/><stop offset="1" stop-color="#103c32"/></linearGradient><linearGradient id="line"><stop stop-color="#46dfaa"/><stop offset="1" stop-color="#e6c77d"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#84d3b6" stroke-opacity=".055"/></pattern></defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif}.orbit{transform-origin:1000px 205px;animation:rotate 40s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 14;animation:flow 8s linear infinite}.rise{animation:rise 6s ease-in-out infinite}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-220}}@keyframes rise{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="210" rx="24" fill="url(#bg)"/><rect width="1200" height="210" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="208" rx="23" fill="none" stroke="#81c7ac" stroke-opacity=".2"/>
<text x="48" y="49" font-size="14" fill="#e6c77d" letter-spacing="2">THE PRINCIPLES BEHIND THE PLATFORM</text><circle cx="56" cy="88" r="5" fill="#62dfaf" class="pulse" style="animation-delay:0s"/><text x="48" y="132" font-size="27" fill="#f1fbf7" font-weight="600">MIZAN</text><text x="48" y="171" font-size="17" fill="#a9c7bf" >Balance, fairness &amp; responsibility</text><circle cx="430" cy="88" r="5" fill="#62dfaf" class="pulse" style="animation-delay:1s"/><text x="422" y="132" font-size="27" fill="#f1fbf7" font-weight="600">NOOR</text><text x="422" y="171" font-size="17" fill="#a9c7bf" >Clarity, knowledge &amp; illumination</text><circle cx="804" cy="88" r="5" fill="#62dfaf" class="pulse" style="animation-delay:2s"/><text x="796" y="132" font-size="27" fill="#f1fbf7" font-weight="600">IMPACT</text><text x="796" y="171" font-size="17" fill="#a9c7bf" >Useful technology for real people</text></svg>
